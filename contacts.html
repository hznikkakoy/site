    <main class="page">
        <div class="section-title reveal">
            <h2>Свяжитесь с нами</h2>
            <p>Мы всегда рады ответить на ваши вопросы</p>
        </div>
        <section class="contact-grid">
            <div class="form-card reveal">
                <form id="contactForm">
<label for="name">Ваше имя</label><input id="name" required placeholder="Как к вам обращаться?">
<label for="email">Email</label><input id="email" type="email" required placeholder="Ваш email">
<label for="grade">Класс</label><select id="grade" required><option value="">Выбор класса</option><option value="Дошкольная группа">Дошкольная группа</option><option value="1 класс">1 класс</option><option value="2 класс">2 класс</option><option value="3 класс">3 класс</option><option value="4 класс">4 класс</option></select>
<label for="message">Сообщение</label><textarea id="message" required placeholder="Напишите ваше сообщение..."></textarea>
<button class="primary" type="submit" style="width:100%;max-width:none;margin-top:16px">Отправить сообщение</button>
<p id="formMessage" class="hint"></p>
</form>
            </div>
            <div class="contact-panel reveal">
                <div class="contact-panel-top">
                    <h2>Наши контакты</h2>
                    <div class="contact-info">
                        <div>Онлайн по всей России</div>
                        <div>Почта: hello@classnik.ru</div>
                        <div class="contact-vk"><a href="#" aria-label="ВКонтакте">VK — ВКонтакте</a></div>
                    </div>
                </div>
                <div class="contact-art"><img src="contacts-owl.jpeg" alt="Сова с конвертом"></div>
            </div>
        </section>
