<!doctype html>
<html lang="ru">

<head>
<meta name="referrer" content="strict-origin-when-cross-origin">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Кабинет учителя — Классник</title>
    <link rel="stylesheet" href="style.css"><link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        .teacher-page {
            max-width: 1180px;
            margin: auto;
            padding: 28px 22px 50px
        }

        .teacher-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            margin-bottom: 18px
        }

        .teacher-top h1 {
            margin: 0;
            font-size: 34px
        }

        .teacher-top p {
            margin: 4px 0 0;
            color: #6b7a87
        }

        .teacher-layout {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 16px
        }

        .teacher-card {
            background: #fff;
            border-radius: 22px;
            padding: 20px;
            box-shadow: var(--shadow)
        }

        .teacher-card h2 {
            margin: 0 0 14px;
            font-size: 22px
        }

        .field {
            margin-bottom: 11px
        }

        .field label {
            display: block;
            font-size: 12px;
            font-weight: 800;
            color: #526474;
            margin-bottom: 5px
        }

        .field input,
        .field textarea {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #dce4ea;
            border-radius: 12px;
            padding: 10px 11px;
            background: #fbfdff;
            font: inherit
        }

        .field textarea {
            min-height: 70px;
            resize: vertical
        }

        .check-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 700;
            margin: 10px 0
        }

        .question-editor {
            border: 1px solid #e5ebef;
            border-radius: 17px;
            padding: 13px;
            margin: 10px 0;
            background: #fbfdff
        }

        .question-editor .q-head {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            align-items: center
        }

        .question-editor textarea {
            min-height: 55px
        }

        .option-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 7px;
            margin-top: 6px
        }

        .option-row input {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #dce4ea;
            border-radius: 10px;
            padding: 8px
        }

        .remove {
            border: 0;
            background: #fff0ec;
            color: #d85c50;
            border-radius: 9px;
            padding: 7px 9px;
            font-weight: 800
        }

        .small-btn {
            border: 0;
            background: #eaf7ff;
            color: #2378c1;
            border-radius: 10px;
            padding: 8px 10px;
            font-weight: 800
        }

        .publish {
            background: #55b77a !important;
            color: #fff !important
        }

        .tests-list {
            display: grid;
            gap: 10px
        }

        .test-item {
            border-radius: 17px;
            padding: 14px;
            background: #f7fbff;
            border: 1px solid #e5eef5
        }

        .test-item h3 {
            margin: 0;
            font-size: 17px
        }

        .test-item p {
            margin: 4px 0;
            color: #70808d;
            font-size: 12px
        }

        .test-actions {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
            margin-top: 9px
        }

        .test-actions button {
            border: 0;
            border-radius: 10px;
            padding: 7px 10px;
            font-weight: 800;
            font-size: 11px
        }

        .danger {
            background: #fff0ec;
            color: #d85c50
        }

        .muted {
            color: #7a8791;
            font-size: 12px
        }

        .teacher-message {
            min-height: 20px;
            margin-top: 8px;
            font-size: 12px;
            font-weight: 800;
            color: #d85c50
        }

        .publish-options {
            display:grid; gap:8px; margin-top:10px; padding:12px; background:#fffaf0; border:1px solid #f2e4b9; border-radius:14px
        }
        .check-row { display:flex; align-items:center; gap:8px; font-weight:800; color:#596b78; font-size:13px }
        .check-row input { width:17px; height:17px; margin:0; accent-color:#4aa3df }
        #scheduleWrap { display:none; margin-top:7px }
        #scheduleWrap.show { display:block }
        #publishAt { width:100%; border:1px solid #dce4ea; border-radius:10px; padding:9px 10px; background:#fff; color:#394c5c }
        .scheduled-note { color:#8a6b20 !important }

        @media(max-width:820px) {
            .teacher-layout {
                grid-template-columns: 1fr
            }

            .teacher-top {
                align-items: flex-start;
                flex-direction: column
            }

            .teacher-top h1 {
                font-size: 29px
            }
        }
    </style>
</head>

<body>
    <header class="site-header">
        <nav class="nav"><a class="logo" href="index.html"><svg class="brand-owl" viewBox="0 0 80 80" aria-label="Логотип совы" role="img">
<defs><linearGradient id="owlHead" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b87950"/><stop offset="1" stop-color="#855039"/></linearGradient><linearGradient id="owlChest" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d69a70"/><stop offset="1" stop-color="#a76648"/></linearGradient></defs>
<path d="M17 28C12 22 9 14 11 8c7 2 13 6 17 12 5-2 10-3 14-3s9 1 14 3c4-6 10-10 17-12 2 6-1 14-6 20 4 6 5 13 4 20-2 15-14 24-29 24S15 63 13 48c-1-7 0-14 4-20Z" fill="url(#owlHead)" stroke="#71442f" stroke-width="2"/><path d="M20 38c0-12 7-21 20-21s20 9 20 21-8 24-20 24-20-12-20-24Z" fill="#f8e5c7"/><ellipse cx="30" cy="37" rx="10" ry="12" fill="#fff"/><ellipse cx="50" cy="37" rx="10" ry="12" fill="#fff"/><circle cx="31" cy="38" r="5.5" fill="#2e2927"/><circle cx="49" cy="38" r="5.5" fill="#2e2927"/><circle cx="33" cy="36" r="1.8" fill="#fff"/><circle cx="51" cy="36" r="1.8" fill="#fff"/><path d="M40 41l7 4-7 7-7-7z" fill="#f3b51b" stroke="#b77708" stroke-width="1.5"/><path d="M27 53c4 5 9 7 13 7s9-2 13-7c-3 9-8 14-13 14s-10-5-13-14Z" fill="url(#owlChest)" opacity=".9"/><path d="M16 51c3 2 7 4 11 4M64 51c-3 2-7-2-11-4" stroke="#7b4b35" stroke-width="4" stroke-linecap="round" opacity=".8"/></svg><span>Классник</span></a>
            <div class="nav-links"><a href="index.html">Главная</a><a href="dashboard.html">Кабинет</a><a class="active"
                    href="teacher-dashboard.html">Учитель</a><a href="login.html">Выйти</a></div><button
                class="menu-toggle" type="button">Меню</button>
        </nav>
    </header>
    <main class="teacher-page">
        <div class="teacher-top">
            <div>
                <h1>Кабинет учителя</h1>
                <p>Создавай тесты для групп, публикуй их и смотри результаты учеников.</p>
            </div><button class="logout" id="logout">Выйти</button>
        </div>
        <div class="teacher-layout">
            <section class="teacher-card">
                <h2 id="formTitle">Новый тест</h2>
                <form id="testForm">
<div class="field"><label>Название теста</label><input id="title" required maxlength="100" placeholder="Например: Русский язык — 1 класс"></div>
<div class="field"><label>Предмет</label><input id="subject" required maxlength="60" placeholder="Русский язык"></div>
<div class="field"><label>Группа</label><select id="grp" required><option value="grade1">1 класс</option><option value="grade2">2 класс</option><option value="grade3">3 класс</option><option value="grade4">4 класс</option><option value="preschool">Дошкольная группа</option></select></div>
<div class="field"><label>Описание</label><textarea id="description" maxlength="300" placeholder="Что нужно сделать ученику?"></textarea></div>
<label class="check-row"><input id="published" type="checkbox"> Сразу опубликовать</label>
<div id="questions"></div>
<div class="add-row"><button class="small-btn" type="button" id="addChoice">＋ Вопрос с вариантами</button><button class="small-btn" type="button" id="addOpen">＋ Вопрос с открытым ответом</button></div>
<button class="primary" style="width:100%;margin-top:12px" type="submit" id="saveBtn">Сохранить тест</button>
<button class="small-btn" type="button" id="cancelEdit" style="display:none;width:100%;margin-top:8px">Отменить изменение</button>
<div class="teacher-message" id="msg"></div></form>
            </section>
            <section class="teacher-card">
                <h2>Мои тесты</h2>
                <div id="tests" class="tests-list">
                    <div class="muted">Загрузка…</div>
                </div>
            </section>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
    <script src="supabase-config.js"></script>
<script src="app.js"></script>
    <script>
const esc = s => String(s ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;');
const sb = window.klassnikSb, $ = s => document.querySelector(s), GN = { preschool: 'Дошкольная группа', grade1: '1 класс', grade2: '2 класс', grade3: '3 класс', grade4: '4 класс' };
let questions = [], uid = 0, me = null, saving = false;
const box = $('#questions');
function addQ(type) { questions.push({ id: ++uid, type, text: '', options: type === 'choice' ? ['', '', '', ''] : [], correct: 0, answer: '' }); renderQ(); box.lastElementChild?.scrollIntoView({ block: 'nearest' }) }
function renderQ() {
  box.innerHTML = questions.map((q, i) => `<div class="question-editor" data-id="${q.id}"><div class="q-head"><strong>Вопрос ${i + 1} · ${q.type === 'open' ? 'открытый ответ' : 'выбор ответа'}</strong><button type="button" class="remove" data-act="rm">Удалить</button></div>
<div class="field" style="margin-top:8px"><label>Текст вопроса</label><textarea class="qtext" maxlength="500" placeholder="Например: Сколько будет 2 + 3?">${esc(q.text)}</textarea></div>` +
    (q.type === 'open' ? `<div class="field"><label>Правильный ответ (ученик напишет его сам)</label><input class="ans" maxlength="100" value="${esc(q.answer)}" placeholder="Например: 5"></div>` :
      `<div class="muted">Варианты ответа. Нажми на номер правильного.</div>` + q.options.map((o, j) => `<div class="option-row"><input class="opt" data-j="${j}" maxlength="100" value="${esc(o)}" placeholder="Вариант ${j + 1}"><button type="button" class="small-btn" data-act="ok" data-j="${j}" style="background:${q.correct === j ? '#55b77a' : '#eef4f7'};color:${q.correct === j ? '#fff' : '#526474'}">${q.correct === j ? '✓ Правильный' : '№ ' + (j + 1)}</button></div>`).join('')) + '</div>').join('');
}
const explain = e => { const m = String(e?.message || e || ''); if (/grp|qtype|schema cache|column/i.test(m)) return 'В базе нет новых полей. Выполните SQL-миграцию v3, затем отдельно команду: notify pgrst, \'reload schema\';  [' + m + ']'; if (/row-level security|permission denied/i.test(m)) return 'Нет прав на сохранение. Проверьте, что у аккаунта роль teacher и выполнены обе миграции. [' + m + ']'; if (/fetch|network/i.test(m)) return 'Нет связи с сервером. Проверьте интернет.'; return 'Ошибка: ' + m };
function cap(el) { const v = el.value, m = v.match(/^(\s*)(\p{Ll})/u); if (!m) return; const pos = el.selectionStart; el.value = m[1] + m[2].toUpperCase() + v.slice(m[1].length + 1); try { el.setSelectionRange(pos, pos) } catch (x) { } }
box.addEventListener('input', e => { const el = e.target.closest('.question-editor'); if (!el) return; const q = questions.find(x => x.id == el.dataset.id); if (!q) return; if (e.target.matches('.qtext,.ans,.opt')) cap(e.target); if (e.target.matches('.qtext')) q.text = e.target.value; else if (e.target.matches('.ans')) q.answer = e.target.value; else if (e.target.matches('.opt')) q.options[+e.target.dataset.j] = e.target.value });
box.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (!b) return; const el = b.closest('.question-editor'), q = questions.find(x => x.id == el.dataset.id); if (b.dataset.act === 'rm') questions = questions.filter(x => x !== q); else q.correct = +b.dataset.j; renderQ() });
$('#addChoice').onclick = () => addQ('choice'); $('#addOpen').onclick = () => addQ('open');

let editingId = null, origIds = [], lastResults = [];
function resetForm() { editingId = null; origIds = []; $('#testForm').reset(); questions = []; addQ('choice'); $('#formTitle').textContent = 'Новый тест'; $('#saveBtn').textContent = 'Сохранить тест'; $('#cancelEdit').style.display = 'none' }
$('#cancelEdit').onclick = () => { resetForm(); $('#msg').textContent = '' };
async function startEdit(id, btn) {
  btn.disabled = true; const { data, error } = await sb.rpc('teacher_get_test', { p_test: id }); btn.disabled = false;
  if (error || !data) { alert('Не удалось открыть тест. Выполните в Supabase файл supabase-update-edit.sql.'); return }
  editingId = id; origIds = data.questions.map(q => q.id);
  $('#title').value = data.title; $('#subject').value = data.subject; $('#description').value = data.description || ''; $('#grp').value = data.grp; $('#published').checked = data.published;
  questions = data.questions.map(q => { const o = (q.options || []).slice(); if (q.qtype === 'choice') while (o.length < 4) o.push(''); return { id: ++uid, dbId: q.id, type: q.qtype, text: q.text, options: q.qtype === 'choice' ? o : [], correct: Math.max(0, o.indexOf(q.correct)), answer: q.qtype === 'open' ? q.correct : '' } });
  renderQ(); $('#formTitle').textContent = 'Изменение теста'; $('#saveBtn').textContent = 'Сохранить изменения'; $('#cancelEdit').style.display = 'block'; $('#msg').textContent = '';
  $('#testForm').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
$('#testForm').onsubmit = async e => {
  e.preventDefault(); if (saving || !me) return; const msg = $('#msg'); msg.style.color = '#e55750';
  const clean = questions.map(q => q.type === 'open' ? { dbId: q.dbId, type: 'open', text: q.text.trim(), options: [], correct: q.answer.trim() } : (() => { const opts = q.options.map(x => x.trim()); return { dbId: q.dbId, type: 'choice', text: q.text.trim(), options: opts.filter(Boolean), correct: opts[q.correct] || '' } })());
  if (!clean.length) { msg.textContent = 'Добавь хотя бы один вопрос.'; return }
  const bad = clean.findIndex(q => !q.text || !q.correct || (q.type === 'choice' && q.options.length < 2));
  if (bad >= 0) { msg.textContent = 'Проверь вопрос ' + (bad + 1) + ': нужен текст, правильный ответ' + (clean[bad].type === 'choice' ? ' и минимум 2 варианта.' : '.'); return }
  if (editingId && lastResults.some(r => r.test_id === editingId) && !confirm('Ученики уже проходили этот тест. Их старые результаты останутся, но изменённые вопросы могут не совпасть с ними. Сохранить изменения?')) return;
  saving = true; $('#saveBtn').disabled = true; msg.style.color = ''; msg.textContent = 'Сохраняю…';
  const fields = { title: $('#title').value.trim(), subject: $('#subject').value.trim(), description: $('#description').value.trim(), grp: $('#grp').value, published: $('#published').checked };
  const rows = clean.map((q, i) => ({ question_text: q.text, options: q.options, correct_answer: q.correct, qtype: q.type, sort_order: i }));
  try {
    if (editingId) {
      const { error } = await sb.from('tests').update(fields).eq('id', editingId); if (error) throw error;
      const keep = clean.filter(q => q.dbId).map(q => q.dbId), gone = origIds.filter(x => !keep.includes(x));
      const outs = await Promise.all(clean.map((q, i) => q.dbId ? sb.from('questions').update(rows[i]).eq('id', q.dbId) : sb.from('questions').insert({ test_id: editingId, ...rows[i] })));
      const fail = outs.find(o => o.error); if (fail) throw fail.error;
      if (gone.length) { const { error: de } = await sb.from('questions').delete().in('id', gone); if (de) throw de }
      resetForm(); msg.style.color = '#55a873'; msg.textContent = 'Изменения сохранены.';
    } else {
      const { data: t, error } = await sb.from('tests').insert({ teacher_id: me.id, ...fields }).select('id').single(); if (error) throw error;
      const { error: qe } = await sb.from('questions').insert(rows.map(r => ({ test_id: t.id, ...r })));
      if (qe) { await sb.from('tests').delete().eq('id', t.id); throw qe }
      resetForm(); msg.style.color = '#55a873'; msg.textContent = 'Готово! Тест сохранён.';
    }
    await load();
  } catch (err) { msg.style.color = '#e55750'; console.error(err); msg.textContent = explain(err) }
  saving = false; $('#saveBtn').disabled = false;
};

async function load() {
  const list = $('#tests');
  try {
    const [tr, rr] = await Promise.all([sb.from('tests').select('id,title,subject,grp,published,questions(id)').eq('teacher_id', me.id).order('created_at', { ascending: false }), sb.rpc('teacher_results')]);
    if (tr.error) throw tr.error; const res = lastResults = rr.data || [];
    if (!tr.data.length) { list.innerHTML = '<div class="muted">Пока нет тестов. Создай первый слева.</div>'; return }
    list.innerHTML = tr.data.map(t => { const rs = res.filter(r => r.test_id === t.id); return `<article class="test-item"><h3>${esc(t.title)}</h3><p>${esc(t.subject)} · ${esc(GN[t.grp] || '')} · ${t.questions?.length || 0} вопр. · ${t.published ? 'опубликован' : 'черновик'}</p>
<div class="test-actions"><button class="publish edit" data-act="edit" data-id="${t.id}">Изменить</button><button class="publish" data-act="pub" data-id="${t.id}" data-v="${!t.published}">${t.published ? 'Снять с публикации' : 'Опубликовать'}</button><button class="danger" data-act="del" data-id="${t.id}">Удалить тест</button></div>
<details class="res"><summary>Результаты учеников: ${rs.length}</summary>${rs.length ? rs.map(r => `<div class="res-row"><b>${esc(r.student_name)}</b> — ${r.score} из ${r.total} <small>${new Date(r.created_at).toLocaleString('ru-RU')}</small><details><summary>Ответы</summary>${(r.details || []).map(d => `<div class="${d.ok ? 'ok' : 'bad'}">${d.ok ? '✓' : '✗'} ${esc(d.q)} — «${esc(d.given || 'нет ответа')}»${d.ok ? '' : ' (верно: ' + esc(d.correct) + ')'}</div>`).join('')}</details></div>`).join('') : '<div class="muted">Пока никто не прошёл.</div>'}</details></article>` }).join('');
  } catch (e) { console.error(e); list.innerHTML = '<div class="muted">Не удалось загрузить тесты. ' + esc(explain(e)) + '</div>' }
}
$('#tests').addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return; if (b.dataset.act === 'edit') { startEdit(b.dataset.id, b); return }
  if (b.dataset.act === 'del' && !confirm('Удалить тест вместе с вопросами и результатами учеников?')) return;
  b.disabled = true;
  const { error } = b.dataset.act === 'del' ? await sb.from('tests').delete().eq('id', b.dataset.id) : await sb.from('tests').update({ published: b.dataset.v === 'true' }).eq('id', b.dataset.id);
  if (error) alert('Не получилось. Попробуй ещё раз.'); load();
});
(async () => {
  try {
    if (!sb) { $('#msg').textContent = 'Не удалось подключиться. Обнови страницу.'; return }
    const { data: { user } } = await sb.auth.getUser(); if (!user) { location.replace('login.html'); return }
    const { data: p } = await sb.from('profiles').select('role').eq('id', user.id).single();
    if (p?.role !== 'teacher') { location.replace('dashboard.html'); return }
    me = user; addQ('choice'); load(); document.addEventListener('visibilitychange', () => { if (!document.hidden) load() });
  } catch (e) { $('#msg').textContent = 'Что-то пошло не так. Обнови страницу.' }
})();
</script>
</body>

</html>
