    <link rel="stylesheet" href="style.css"><link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        .test-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px
        }

        .published-test {
            background: #fff;
            border-radius: 18px;
            padding: 14px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px
        }

        .published-test h3 {
            margin: 0;
            font-size: 16px
        }

        .published-test p {
            margin: 3px 0 0;
            color: #72818d;
            font-size: 11px
        }

        .published-test a {
            white-space: nowrap;
            text-decoration: none;
            border-radius: 10px;
            padding: 8px 11px;
            background: #4aa3df;
            color: #fff;
            font-size: 11px;
            font-weight: 800
        }

        .attempt-list {
            margin-top: 10px;
            display: grid;
            gap: 7px
        }

        .attempt {
            background: #f7fbff;
            border-radius: 13px;
            padding: 10px 12px;
            font-size: 12px;
            display: flex;
            justify-content: space-between
        }

        .teacher-banner {
            display: none;
            background: #f4effc;
            border-radius: 18px;
            padding: 13px;
            margin: 15px 0
        }

        .teacher-banner a {
            color: #7650ad;
            font-weight: 800;
            text-decoration: none
        }

        @media(max-width:700px) {
            .test-grid {
                grid-template-columns: 1fr
            }

            .published-test {
                align-items: flex-start;
                flex-direction: column
            }
        }
    </style>
</head>

<script src="app.js"></script>
    <script>
const esc = s => String(s ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;');
const sb = window.klassnikSb, $ = s => document.querySelector(s), GN = { preschool: 'Дошкольная группа', grade1: '1 класс', grade2: '2 класс', grade3: '3 класс', grade4: '4 класс' };
const emoji = x => /рус/i.test(x) ? '📕' : /мат/i.test(x) ? '🔢' : /англ|english/i.test(x) ? '🔤' : '📘';
async function init() {
  try {
    if (!sb) { $('#tests').innerHTML = '<div class="hint">Не удалось подключиться. Обнови страницу.</div>'; return }
    const { data: { user } } = await sb.auth.getUser(); if (!user) { location.replace('login.html'); return }
    const { data: p, error: pe } = await sb.from('profiles').select('name,role,grp').eq('id', user.id).single();
    if (pe || !p) { $('#roleText').textContent = 'Не удалось загрузить профиль. Обнови страницу.'; return }
    if (p.role === 'teacher') { location.replace('teacher-dashboard.html'); return }
    const grp = p.grp || 'grade1';
    $('#hello').textContent = 'Привет, ' + p.name + '! 🦉';
    const [tr, ar] = await Promise.all([
      sb.from('tests').select('id,title,subject,questions(id)').eq('published', true).eq('grp', grp).order('created_at', { ascending: false }),
      sb.from('attempts').select('id,score,total,created_at,test_id,tests(title,subject)').eq('student_id', user.id).order('created_at', { ascending: false })]);
    const attempts = ar.data || [], done = new Set(attempts.map(a => a.test_id)), all = tr.data || [], fresh = all.filter(t => !done.has(t.id));
    $('#roleText').textContent = (GN[grp] || '') + ' · ' + (fresh.length ? 'новых тестов: ' + fresh.length : 'новых тестов пока нет');
    $('#tests').innerHTML = tr.error ? '<div class="hint">Не получилось загрузить тесты. Обнови страницу.</div>' : !fresh.length ? '<div class="hint">Все тесты пройдены! 🎉 Скоро появятся новые.</div>' :
      fresh.map(t => `<article class="published-test tile"><div class="tile-emoji">${emoji(t.subject)}</div><h3>${esc(t.title)}</h3><p>${esc(t.subject)} · ${t.questions?.length || 0} вопр.</p><a href="test.html?id=${encodeURIComponent(t.id)}">Пройти</a></article>`).join('');
    const mine = attempts.filter(a => all.some(t => t.id === a.test_id)), pct = mine.length ? Math.round(mine.reduce((x, a) => x + (a.total ? a.score / a.total : 0), 0) / mine.length * 100) : 0;
    $('#progressText').textContent = 'Пройдено тестов: ' + attempts.length + (all.length ? ' из ' + Math.max(all.length, attempts.length) : '');
    $('#progressPercent').textContent = pct + '%'; $('#progressBar').style.width = pct + '%';
    $('#attempts').innerHTML = !attempts.length ? '<div class="hint">Ты ещё не проходил тесты.</div>' : attempts.map(a => `<div class="attempt tile done"><div class="tile-stars">${'⭐'.repeat(Math.round(a.score / Math.max(a.total, 1) * 3)) || '🌱'}</div><h3>${esc(a.tests?.title || 'Тест')}</h3><p>${new Date(a.created_at).toLocaleDateString('ru-RU')}</p><strong>${a.score} из ${a.total}</strong><a href="test.html?id=${encodeURIComponent(a.test_id)}">Смотреть ответы</a></div>`).join('');
  } catch (e) { $('#roleText').textContent = 'Что-то пошло не так. Обнови страницу.' }
}
init();
</script>
