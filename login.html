<!doctype html>
<html lang="ru">

<head>
<meta name="referrer" content="strict-origin-when-cross-origin">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Личный кабинет — Классник</title>
    <link rel="stylesheet" href="style.css"><link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        .auth-note {
            font-size: 12px;
            color: #6f7f8b;
            margin: 8px 0
        }

        .role-note {
            background: #fff7e8;
            border-radius: 13px;
            padding: 9px;
            font-size: 11px;
            color: #6d6657;
            margin-top: 10px
        }
    </style>
</head>

<body>
    <header class="site-header">
        <nav class="nav"><a class="logo" href="index.html"><svg class="brand-owl" viewBox="0 0 80 80" aria-label="Логотип совы" role="img">
<defs><linearGradient id="owlHead" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b87950"/><stop offset="1" stop-color="#855039"/></linearGradient><linearGradient id="owlChest" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d69a70"/><stop offset="1" stop-color="#a76648"/></linearGradient></defs>
<path d="M17 28C12 22 9 14 11 8c7 2 13 6 17 12 5-2 10-3 14-3s9 1 14 3c4-6 10-10 17-12 2 6-1 14-6 20 4 6 5 13 4 20-2 15-14 24-29 24S15 63 13 48c-1-7 0-14 4-20Z" fill="url(#owlHead)" stroke="#71442f" stroke-width="2"/><path d="M20 38c0-12 7-21 20-21s20 9 20 21-8 24-20 24-20-12-20-24Z" fill="#f8e5c7"/><ellipse cx="30" cy="37" rx="10" ry="12" fill="#fff"/><ellipse cx="50" cy="37" rx="10" ry="12" fill="#fff"/><circle cx="31" cy="38" r="5.5" fill="#2e2927"/><circle cx="49" cy="38" r="5.5" fill="#2e2927"/><circle cx="33" cy="36" r="1.8" fill="#fff"/><circle cx="51" cy="36" r="1.8" fill="#fff"/><path d="M40 41l7 4-7 7-7-7z" fill="#f3b51b" stroke="#b77708" stroke-width="1.5"/><path d="M27 53c4 5 9 7 13 7s9-2 13-7c-3 9-8 14-13 14s-10-5-13-14Z" fill="url(#owlChest)" opacity=".9"/><path d="M16 51c3 2 7 4 11 4M64 51c-3 2-7-2-11-4" stroke="#7b4b35" stroke-width="4" stroke-linecap="round" opacity=".8"/></svg><span>Классник</span></a>
            <div class="nav-links"><a href="index.html">Главная</a><a href="teacher.html">Об учителе</a><a
                    href="prices.html">Цены</a><a href="contacts.html">Контакты</a><a class="login-link active"
                    href="login.html">Войти</a></div><button class="menu-toggle" type="button">Меню</button>
        </nav>
    </header>
    <main class="auth-wrap">
        <div class="auth-shell">
            <div class="auth-heading">
                <h1>Личный кабинет</h1>   
            </div>
            <div class="auth-columns">
                <section class="auth-card login">
                    <h2>Вход</h2>
                    <form class="auth-form active" id="loginForm"><label>Email</label><input id="loginEmail"
                            type="email" required placeholder="you@example.com"><label>Пароль</label><input
                            id="loginPass" type="password" required placeholder="Введите пароль"><label
                            class="remember"><input id="rememberMe" type="checkbox"><span
                                class="checkmark"></span><span>Запомнить меня</span></label><button class="primary"
                            type="submit">Войти</button>
                        <div class="message" id="loginMsg"></div>
                    </form>
                </section>
                <section class="auth-card register">
                    <h2>Регистрация</h2>
                    <form class="auth-form active" id="registerForm"><label>Имя</label><input id="regName" required
                            placeholder="Как вас зовут?"><label>Email</label><input id="regEmail" type="email" required
                            placeholder="you@example.com"><label>Пароль</label><input id="regPass" type="password"
                            minlength="8" required autocomplete="new-password" placeholder="Минимум 8 символов"><label>Телефон родителя (РФ)</label><input id="regPhone" type="tel" required autocomplete="tel" placeholder="+7 900 000-00-00">
<label>Группа ребёнка</label><select id="regGrp" required><option value="">Выберите…</option><option value="preschool">Дошкольная группа</option><option value="grade1">1 класс</option><option value="grade2">2 класс</option><option value="grade3">3 класс</option><option value="grade4">4 класс</option></select>
<label class="consent"><input id="cParent" type="checkbox" required><span>Мне есть 18 лет, я родитель или законный представитель ребёнка</span></label>
<label class="consent"><input id="cOffer" type="checkbox" required><span>Я принимаю <a href="legal.html#offer" target="_blank" rel="noopener">условия оферты</a> и <a href="legal.html#consent" target="_blank" rel="noopener">даю согласие на обработку персональных данных</a> (<a href="legal.html#privacy" target="_blank" rel="noopener">политика</a>)</span></label>
<label class="consent"><input id="cMail" type="checkbox"><span>Хочу получать новости школы (необязательно, <a href="legal.html#mailing" target="_blank" rel="noopener">подробнее</a>)</span></label>
<button class="primary" type="submit" style="background:#55b77a">Создать аккаунт</button>
                        <div class="message" id="regMsg"></div>
                    </form>
                </section>
            </div>
            <p class="auth-note">🦉 Регистрирует ребёнка взрослый. Мы храним только имя, телефон родителя и результаты тестов. Пароль в браузере не сохраняется.</p>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
    <script src="supabase-config.js"></script>
<script src="app.js"></script>
    <script>
        const ok = SUPABASE_URL && !SUPABASE_URL.includes('YOUR-PROJECT') && SUPABASE_ANON_KEY && !SUPABASE_ANON_KEY.includes('YOUR_'); const sb = window.klassnikSb; const setMsg = (id, t, good = false) => { const e = document.querySelector(id); e.textContent = t; e.style.color = good ? '#55a873' : '#e55750' };
        (async () => { if (!sb) { setMsg('#loginMsg', 'Сначала настрой supabase-config.js.'); return } const { data: { session } } = await sb.auth.getSession(); if (session) location.replace('dashboard.html') })();
        document.querySelector('#registerForm').onsubmit = async e => { e.preventDefault(); if (!sb) return; setMsg('#regMsg', 'Создаю аккаунт…', true); const name = regName.value.trim(), email = regEmail.value.trim(), password = regPass.value; const d = regPhone.value.replace(/\D/g, ''); const ph = /^[78]\d{10}$/.test(d) ? '+7' + d.slice(1) : /^9\d{9}$/.test(d) ? '+7' + d : ''; if (!ph) { setMsg('#regMsg', 'Укажите российский номер: +7 и 10 цифр.'); return } if (!cParent.checked || !cOffer.checked) { setMsg('#regMsg', 'Отметьте обязательные галочки.'); return } const btn = e.target.querySelector('button[type=submit]'); btn.disabled = true; setTimeout(() => btn.disabled = false, 4000); const { data, error } = await sb.auth.signUp({ email, password, options: { data: { name, phone: ph, parent_confirmed: true, consent_at: new Date().toISOString(), mailing_consent: cMail.checked, grp: regGrp.value } } }); if (error) { setMsg('#regMsg', error.message); return } if (data.session) { location.href = 'dashboard.html'; return } setMsg('#regMsg', 'Аккаунт создан. Если включено подтверждение email, подтверди почту и затем войди.', true) };
        document.querySelector('#loginForm').onsubmit = async e => { e.preventDefault(); if (!sb) return; setMsg('#loginMsg', 'Вхожу…', true); const { data, error } = await sb.auth.signInWithPassword({ email: loginEmail.value.trim(), password: loginPass.value }); if (error) { setMsg('#loginMsg', 'Неверный email или пароль.'); return } const user = data.user; const { data: profile, error: profileError } = await sb.from('profiles').select('role').eq('id', user.id).single(); if (profileError) { setMsg('#loginMsg', 'Аккаунт вошёл, но профиль не найден: ' + profileError.message); return } location.href = profile.role === 'teacher' ? 'teacher-dashboard.html' : 'dashboard.html' };
    </script>
</body>

</html>
